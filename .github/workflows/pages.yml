# Publie la page sur GitHub Pages.
#
# L'outil tourne entierement dans le navigateur : demander a quelqu'un de
# cloner et de compiler pour l'essayer annule ce que le projet a de simple.
# dist/ n'est pas dans le depot, il est construit ici, donc la page publiee
# correspond toujours au code de la branche et jamais a une compilation
# oubliee sur une machine.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Assembler le site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r dist _site/dist
          cp -r assets _site/assets

      # La publication precedente etait verte et la page etait nue : assets/
      # n'etait pas copie, donc la feuille de style et la police renvoyaient
      # 404 sans que rien n'echoue. Une etape qui reussit toujours ne prouve
      # rien, donc celle-ci relit la page et exige chaque fichier qu'elle
      # reference. Le controle negatif est teste juste apres.
      - name: Verifier que la page a tout ce qu'elle appelle
        run: |
          set -eu
          manque=0
          for f in $(grep -oE '(href|src)="\./[^"]+"' index.html \
                     | sed -E 's/.*"\.\/([^"]+)"/\1/' | sort -u); do
            if [ -e "_site/$f" ]; then
              echo "  ok       $f"
            else
              echo "  MANQUANT $f"
              manque=1
            fi
          done
          if [ "$manque" -ne 0 ]; then
            echo "La page reference des fichiers absents du site assemble." >&2
            exit 1
          fi

      - name: Prouver que la verification sait echouer
        run: |
          set -eu
          rm -rf _controle && cp -r _site _controle
          rm -f _controle/assets/road-book.css
          if for f in $(grep -oE '(href|src)="\./[^"]+"' index.html \
                        | sed -E 's/.*"\.\/([^"]+)"/\1/' | sort -u); do
               [ -e "_controle/$f" ] || exit 1
             done; then
            echo "Le controle negatif n'a rien detecte : la verification est inutile." >&2
            exit 1
          fi
          echo "  la verification detecte bien un fichier manquant"
          rm -rf _controle
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
