# Publie la page sur GitHub Pages.
#
# L'outil tourne entierement dans le navigateur : demander a quelqu'un de
# cloner et de compiler pour l'essayer annule ce que le projet a de simple.
# dist/ n'est pas dans le depot, il est construit ici, donc la page publiee
# correspond toujours au code de la branche et jamais a une compilation
# oubliee sur une machine.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Assembler le site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r dist _site/dist
          cp -r assets _site/assets

      # Une etape qui reussit toujours ne prouve rien, donc la verification
      # est suivie d'un controle negatif qui lui efface un fichier.
      - name: Verifier que la page a tout ce qu'elle appelle
        run: tools/verifier-site.sh _site

      - name: Prouver que la verification sait echouer
        run: |
          rm -rf _controle && cp -r _site _controle
          rm -f _controle/assets/road-book.css
          if tools/verifier-site.sh _controle; then
            echo "Le controle negatif n'a rien detecte : la verification est inutile." >&2
            exit 1
          fi
          echo "  la verification detecte bien un fichier manquant"
          rm -rf _controle

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
